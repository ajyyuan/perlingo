<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spanish voice samples · Perlingo</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#25332d;font:16px/1.5 system-ui,sans-serif}main{max-width:780px;margin:60px auto;padding:24px}h1{font-size:34px;font-weight:500;letter-spacing:-1px;margin-bottom:8px}.muted{color:#737b75;font-size:14px}select{width:100%;font:inherit;padding:14px;background:#fffefa;border:1px solid #d6ddd5;border-radius:10px;margin:24px 0 4px}.voices{margin-top:28px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:center;padding:20px 0;border-bottom:1px solid #dde2db}button{font:inherit;background:transparent;border:0;border-radius:8px;color:#376451;padding:12px;cursor:pointer;text-align:left}button:hover,button[aria-pressed=true]{background:#e6efe7}button:focus-visible,select:focus-visible{outline:2px solid #376451;outline-offset:3px}button small{display:block;color:#737b75;font-size:12px}#status{min-height:24px;font-size:14px;color:#737b75}@media(max-width:500px){main{margin:20px auto}.row{grid-template-columns:85px 1fr 1fr;gap:4px}button{padding:10px 5px;font-size:14px}}
</style><main><a href="/lemmas/" class="muted">← Course</a><h1>Spanish voice samples</h1><p class="muted">Same words, eight voices. Choose a sample, then compare.</p><label for="sample" class="muted">Sample</label><select id="sample"></select><p id="translation" class="muted"></p><div class="voices" id="voices"></div><p id="status" role="status"></p><p class="muted">Sample only · The course audio has not changed.</p></main><script type="module">
const [plan,ledger]=await Promise.all(['plan.json','ledger.json'].map(p=>fetch(p).then(r=>r.json())));
const translations=['to do / to make','you did / made','we would do / make','Yesterday you made the meal.','I hope you have time.','Ana likes the song.'];
const names={'es-ES':'Spain','es-MX':'Mexico','es-AR':'Argentina','es-CO':'Colombia'};
const select=document.querySelector('#sample'),status=document.querySelector('#status');let audio=null,active=null;
function stop(){if(audio){audio.pause();audio.removeAttribute('src');audio.load();audio=null;}active?.setAttribute('aria-pressed','false');active=null;status.textContent='';}
plan.texts.forEach((text,i)=>select.add(new Option(text,i)));
function update(){stop();document.querySelector('#translation').textContent=translations[Number(select.value)];}
select.addEventListener('change',update);update();
for(const [locale,country]of Object.entries(names)){
 const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=country;row.append(name);
 for(const gender of ['masculine','feminine']){const job=plan.jobs.find(j=>j.locale===locale&&j.gender===gender),button=document.createElement('button');button.type='button';button.setAttribute('aria-pressed','false');button.setAttribute('aria-label',`Play ${country} ${gender} voice`);const label=document.createElement('span');label.textContent='▷ '+gender[0].toUpperCase()+gender.slice(1);const voice=document.createElement('small');voice.textContent=job.voice.split('-')[2].replace('Neural','');button.append(label,voice);
 button.onclick=()=>{if(active===button){stop();return;}stop();const clip=Object.values(ledger.clips).find(c=>c.voice===job.voice&&c.text===plan.texts[Number(select.value)]&&c.status==='complete');if(!clip){status.textContent='Sample not available yet.';return;}active=button;button.setAttribute('aria-pressed','true');audio=new Audio(clip.file);const current=audio;current.onended=()=>{if(audio===current)stop();};current.onerror=()=>{if(audio===current){stop();status.textContent='Audio could not play.';}};current.play().catch(()=>{if(audio===current){stop();status.textContent='Audio could not play.';}});};row.append(button);}
 document.querySelector('#voices').append(row);
}
window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script></html>
