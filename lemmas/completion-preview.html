<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completion preview · Perlingo</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/lemmas/sprint.css"><link rel="stylesheet" href="/lemmas/completion-feedback.css"></head><body><div class="shell"><header class="top"><a class="brand" href="/lemmas/">perlingo<span>.</span></a><span>Completion preview</span></header><main id="preview"><section class="concept stage"><div class="study-head"><span class="eyebrow">Set 1 · Batch 1 / 5</span><span>Complete</span></div><div class="concept-body"><h1>Ten checked.</h1><p class="muted">10 / 10 on the first try. A fully correct pass completed.</p><div class="stage-actions"><button class="primary" id="replay">Replay completion</button></div></div></section></main><p class="muted">Preview only. Your course progress is unchanged.</p></div><script type="module">
import {createCompletionFeedback} from './completion-feedback.js';
const host=document.querySelector('#preview');const feedback=createCompletionFeedback({enabled:()=>true});
document.querySelector('#replay').onclick=()=>{host.querySelector('.completion-mark')?.remove();host.querySelector('.concept-body').classList.remove('completion-arrival');void host.offsetWidth;feedback.celebrate(host);};
</script></body></html>
