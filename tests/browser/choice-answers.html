<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCQ review · Perlingo</title>
<style>
 body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#26372d;background:#fafaf7}
 button,select{font:inherit}label{display:block;margin:16px 0 6px}select{max-width:100%;padding:8px}
 #status{font-weight:600}#choices{display:grid;gap:10px}#choices button{text-align:left;padding:14px;border:1px solid #d9dfd7;border-radius:10px;background:white;color:inherit}
 #choices button:disabled{opacity:1}#choices button[data-correct]{border-color:#356b55;background:#edf5ef}
 #choices button[data-wrong]{border-color:#b44736;background:#fff0ed}
 .tools{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}.tools button{border:0;background:none;color:#356b55;padding:6px 0;text-decoration:underline;cursor:pointer}
 #feedback{min-height:24px}#cue{color:#657066}button:focus-visible,select:focus-visible{outline:2px solid #356b55;outline-offset:3px}
</style>
<h1>MCQ review</h1>
<p>Uses the app’s option bank and grading code. Saved progress is unaffected.</p>
<p id="status" role="status">Loading…</p>
<label for="card">Card</label><select id="card"></select>
<h2 id="word" lang="es"></h2><p id="cue"></p>
<div id="choices" role="group" aria-label="Choose the English meaning"></div>
<p id="feedback" role="status"></p>
<div class="tools"><button id="again">Try again</button><button id="legacy">Check old-question refresh</button></div>
<p id="migration" role="status"></p>
<script type="module" src="./choice-answers.js"></script>
</html>
